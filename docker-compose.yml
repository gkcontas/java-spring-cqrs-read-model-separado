services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7.0
    # Published on 27018, not on the default 27017, so a MongoDB already running on this
    # machine does not collide with it — and, more importantly, so this project can never
    # end up writing into somebody else's instance by accident.
    ports:
      - "27018:27017"
    volumes:
      - shop-mongodata:/data/db

volumes:
  shop-pgdata:
  shop-mongodata:
